name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run check-types

      - run: bun run lint:check

      - run: bun run test

  # `@graphql-suite/schema` supports graphql 16 and 17, so the library packages
  # are built, typed and tested against both. `example-news-app` stays out of
  # this lane — graphql-yoga 5 still peers on graphql 16.
  graphql-17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun run scripts/use-graphql.ts 17

      - run: bun run build

      - run: bun run --filter '@graphql-suite/*' check-types

      - run: bun run --filter '@graphql-suite/*' test
