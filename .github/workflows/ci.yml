name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run check-types

      - run: bun run lint:check

      - run: bun run test

  # `@graphql-suite/schema` declares `graphql: ^16.4.0 || ^17.0.0`, so the
  # versions that define that range are each built, type-checked and tested
  # across the whole workspace — the library packages and the example app.
  #
  #   16.4.0   the declared floor (the release where `getArgumentValues`
  #            became a root export, which the resolve-info parser needs)
  #   16.14.2  the newest graphql 16, i.e. what `^16` installs today
  #   17.0.2   the newest graphql 17
  #
  # Linting is version-independent and stays in the job above, which also
  # covers the committed lockfile.
  graphql:
    name: graphql ${{ matrix.graphql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        graphql: ['16.4.0', '16.14.2', '17.0.2']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun run scripts/use-graphql.ts ${{ matrix.graphql }}

      - run: bun run build

      - run: bun run check-types

      - run: bun run test
