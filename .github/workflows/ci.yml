name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run check-types

      - run: bun run lint:check

      - run: bun run test

  # Both graphql majors are supported, so the whole workspace — library
  # packages and the example app — is built, typed and tested against each.
  # Linting is version-independent and stays in the job above.
  graphql-17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun run scripts/use-graphql.ts 17

      - run: bun run build

      - run: bun run check-types

      - run: bun run test
